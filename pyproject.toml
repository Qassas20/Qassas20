[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-calibration"
version = "0.1.0"
description = "Reality Calibration Layer for the multi-bucket trading bot — makes Alpaca paper trading a valid predictor of live performance."
readme = "docs/CALIBRATION.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []   # stdlib only (sqlite3, subprocess, dataclasses)

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = [
    "trading_bot",
    "trading_bot.calibration",
    "trading_bot.db",
    "trading_bot.execution",
    "trading_bot.reporting",
]

[tool.setuptools.package-data]
"trading_bot.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
